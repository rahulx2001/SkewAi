# Mapping: warranty-claims CSV columns → canonical records fields.
# Second source for the automotive pack (Axion slice): dealer/OEM warranty
# claims land alongside NHTSA complaints and call transcripts in `records`,
# distinguished by source="WARRANTY". Entity keys (VIN/serial via MODELTXT
# where present, make/model) link claims to complaints across sources.
# Executed by scripts/ingest_source.py --source warranty.

source: warranty claims CSV
records:
  record_id: CLAIM_ID
  received_at: CLAIM_DATE
  occurred_at: REPAIR_DATE
  entity_1: MODEL_YR
  entity_2: MAKETXT
  entity_3: MODELTXT
  category: COMPNAME
  subcategory: FAIL_CODE
  text: TECH_NOTES
  severity_label: CLAIM_SEVERITY
  region: STATE
  source: "WARRANTY"
  entity_key: "{MODEL_YR}|{MAKETXT}|{MODELTXT}"
